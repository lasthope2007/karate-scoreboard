name: karate_scoreboard
description: Lightweight landscape karate kumite scoreboard for Android.
publish_to: 'none'
version: 1.0.0+1
environment:
  sdk: '>=3.3.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.3.2
  audioplayers: ^6.1.0
  flutter_launcher_icons: ^0.14.4
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/z_score_icon.png
    - assets/z_score_splash.png
    - assets/countdown.wav
    - assets/match_end.wav

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/z_score_icon.png
  min_sdk_android: 21
