<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#111a2b"/><stop offset=".58" stop-color="#070b13"/><stop offset="1" stop-color="#160910"/></linearGradient>
 <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#18c9ff"/><stop offset=".52" stop-color="#536dff"/><stop offset="1" stop-color="#ff294f"/></linearGradient>
 <linearGradient id="gi" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffffff"/><stop offset="1" stop-color="#aab8d0"/></linearGradient>
 <filter id="glow" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="18"/></filter>
</defs>
<rect width="1024" height="1024" rx="220" fill="#03050a"/>
<rect x="70" y="70" width="884" height="884" rx="205" fill="url(#bg)" stroke="url(#rim)" stroke-width="8"/>
<circle cx="512" cy="480" r="315" fill="none" stroke="#182338" stroke-width="5"/>
<path d="M254 617 A300 300 0 0 1 405 222" fill="none" stroke="#11bfff" stroke-width="15" stroke-linecap="round"/>
<path d="M680 244 A300 300 0 0 1 785 601" fill="none" stroke="#ff2e51" stroke-width="15" stroke-linecap="round"/>
<path d="M344 713 L514 551 L712 330 L760 342 L628 500 L495 617 L718 617 L676 677 L344 713Z" fill="#078bff" opacity=".45" filter="url(#glow)"/>
<!-- compact, readable kumite fighter silhouette -->
<circle cx="487" cy="274" r="51" fill="url(#gi)"/>
<path d="M445 265 Q484 227 528 260 L527 278 Q484 254 447 285Z" fill="#101827"/>
<path d="M449 333 L534 324 L587 423 L548 485 L439 456 L419 381Z" fill="url(#gi)" stroke="#fff" stroke-width="5" stroke-linejoin="round"/>
<!-- raised guard arm -->
<path d="M456 350 L390 333 L346 378 L317 358 L367 296 L477 308Z" fill="url(#gi)" stroke="#f5f8ff" stroke-width="5" stroke-linejoin="round"/>
<!-- striking arm -->
<path d="M526 347 L585 301 L638 317 L625 347 L589 342 L563 402Z" fill="url(#gi)" stroke="#f5f8ff" stroke-width="5" stroke-linejoin="round"/>
<!-- grounded leg -->
<path d="M453 451 L520 463 L484 559 L407 624 L378 596 L430 532Z" fill="url(#gi)" stroke="#f5f8ff" stroke-width="5" stroke-linejoin="round"/>
<!-- high side kick -->
