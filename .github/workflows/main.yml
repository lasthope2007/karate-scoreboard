
name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # This repository currently contains Dart source but no android/ platform folder.
      # Generate the standard Android project files before building the APK.
      - name: Generate Android platform files
        run: flutter create --platforms=android --project-name=karate_scoreboard .

      - name: Set Android launcher name
        run: sed -i 's/android:label="karate_scoreboard"/android:label="Z-Score"/' android/app/src/main/AndroidManifest.xml

      - name: Install dependencies
        run: flutter pub get

      - name: Run tests
        run: flutter test

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: karate-elite-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
