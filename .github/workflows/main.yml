
name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # This repository currently contains Dart source but no android/ platform folder.
      # Generate the standard Android project files before building the APK.
      - name: Generate Android platform files
        run: flutter create --platforms=android --project-name=karate_scoreboard .

      # Pin a stable NDK instead of Flutter's newest default; this avoids flaky
      # downloads of the newest NDK archive on hosted runners.
      - name: Install stable Android NDK
        run: |
          sed -i 's/ndkVersion = flutter.ndkVersion/ndkVersion = "27.0.12077973"/' android/app/build.gradle.kts
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null
          for attempt in 1 2 3; do
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;27.0.12077973" && break
            rm -rf "$ANDROID_HOME/ndk/27.0.12077973"
            if [ "$attempt" -eq 3 ]; then exit 1; fi
            sleep 5
          done

      - name: Generate app icon
        run: |
          sudo apt-get update
          sudo apt-get install -y librsvg2-bin
          mkdir -p assets
          rsvg-convert -w 1024 -h 1024 assets/z_score_icon.svg -o assets/z_score_icon.png
          rsvg-convert -w 1800 -h 760 assets/z_score_splash.svg -o assets/z_score_splash.png

      - name: Set Android launcher name
        run: sed -i 's/android:label="karate_scoreboard"/android:label="Z-Score"/' android/app/src/main/AndroidManifest.xml

      - name: Install dependencies
        run: flutter pub get
          
      - name: Generate launcher icons
        run: dart run flutter_launcher_icons

      - name: Run tests
        run: flutter test

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: karate-elite-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
