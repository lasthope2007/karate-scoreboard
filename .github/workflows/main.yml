
name: Build Android APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # This repository currently contains Dart source but no android/ platform folder.
      # Generate the standard Android project files before building the APK.
      - name: Generate Android platform files
        run: flutter create --platforms=android --project-name=karate_scoreboard .

      - name: Generate app icon and referee sounds
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick
          mkdir -p assets
          # The supplied Z-Score artwork is stored losslessly as a compact base64 JPEG.
          base64 -d assets/z_score_icon.jpg.b64 > assets/z_score_icon.jpg
          convert assets/z_score_icon.jpg -resize 1024x1024 assets/z_score_icon.png
          python3 - <<'PY'
          import math, struct, wave
          RATE = 44100

          def write_samples(path, samples):
              with wave.open(path, 'wb') as out:
                  out.setnchannels(1)
                  out.setsampwidth(2)
                  out.setframerate(RATE)
                  out.writeframes(b''.join(struct.pack('<h', max(-32768, min(32767, int(v)))) for v in samples))

          # A clear, whistle-like rising/falling tone when the clock reaches 15 seconds.
          whistle_duration = 0.85
          whistle_count = int(RATE * whistle_duration)
          whistle = []
          phase = 0.0
          for i in range(whistle_count):
              t = i / RATE
              progress = i / max(1, whistle_count - 1)
              freq = 1750 + 650 * math.sin(math.pi * progress)
              phase += 2 * math.pi * freq / RATE
              envelope = min(1.0, i / (RATE * 0.035), (whistle_count - i) / (RATE * 0.08))
              sample = 19000 * envelope * (math.sin(phase) + 0.18 * math.sin(2 * phase))
              whistle.append(sample)
          write_samples('assets/countdown.wav', whistle)

          # Long, attention-grabbing end-of-match buzzer with a short fade at both ends.
          buzzer_duration = 1.65
          buzzer_count = int(RATE * buzzer_duration)
          buzzer = []
          for i in range(buzzer_count):
              t = i / RATE
              envelope = min(1.0, i / (RATE * 0.025), (buzzer_count - i) / (RATE * 0.10))
              pulse = 0.82 + 0.18 * math.sin(2 * math.pi * 7 * t)
              tone = math.sin(2 * math.pi * 980 * t) + 0.22 * math.sin(2 * math.pi * 1960 * t)
              buzzer.append(22000 * envelope * pulse * tone / 1.22)
          write_samples('assets/match_end.wav', buzzer)
          PY

      - name: Set Android launcher name
        run: sed -i 's/android:label="karate_scoreboard"/android:label="Z-Score"/' android/app/src/main/AndroidManifest.xml

      - name: Install dependencies
        run: flutter pub get
          
      - name: Generate launcher icons
        run: dart run flutter_launcher_icons

      - name: Run tests
        run: flutter test

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: karate-elite-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
